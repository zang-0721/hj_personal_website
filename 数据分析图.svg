<svg width="800" height="520" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <!-- 上方三个环形进度环 -->
  <g transform="translate(130,130)">
    <!--绿色环-->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#d2f8e8" stroke-width="14"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#00b87c" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="400 502" stroke-dashoffset="0"/>
  </g>
  <g transform="translate(400,130)">
    <!--橙色环-->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffe8d8" stroke-width="14"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ff7823" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="340 502"/>
  </g>
  <g transform="translate(670,130)">
    <!--紫色环-->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#efe8ff" stroke-width="14"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a24cdc" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="370 502"/>
  </g>

  <!--下方圆角渐变柱状图 -->
  <g transform="translate(60, 300)">
    <!--模拟高度随机柱子，rx实现圆角，两组颜色：浅蓝过渡→深蓝 -->
    <rect x="0" y="120" width="32" height="80" rx="6" fill="#c6e0ff"/>
    <rect x="50" y="100" width="32" height="100" rx="6" fill="#b8d8ff"/>
    <rect x="100" y="105" width="32" height="95" rx="6" fill="#b0d3ff"/>
    <rect x="150" y="75" width="32" height="125" rx="6" fill="#a4ccff"/>
    <rect x="200" y="130" width="32" height="70" rx="6" fill="#cbe3ff"/>
    <rect x="250" y="50" width="32" height="150" rx="6" fill="#96c4ff"/>
    <rect x="300" y="70" width="32" height="130" rx="6" fill="#a0cbff"/>
    <rect x="350" y="45" width="32" height="155" rx="6" fill="#8fbf_ff"/>
    <rect x="400" y="60" width="32" height="140" rx="6" fill="#99c7ff"/>

    <rect x="450" y="80" width="32" height="120" rx="6" fill="#245bff"/>
    <rect x="500" y="60" width="32" height="140" rx="6" fill="#1c52ff"/>
    <rect x="550" y="45" width="32" height="155" rx="6" fill="#144aff"/>
    <rect x="600" y="30" width="32" height="170" rx="6" fill="#0c41ff"/>
    <rect x="650" y="20" width="32" height="180" rx="6" fill="#0038ff"/>
  </g>

  <!-- 淡淡的Y轴刻度线（和原图一样浅灰色） -->
  <g stroke="#e2e4e8" stroke-width="1">
    <line x1="40" y1="300" x2="50" y2="300"/>
    <line x1="40" y1="340" x2="50" y2="340"/>
    <line x1="40" y1="380" x2="50" y2="380"/>
    <line x1="40" y1="420" x2="50" y2="420"/>
    <line x1="40" y1="460" x2="50" y2="460"/>
  </g>
</svg>
